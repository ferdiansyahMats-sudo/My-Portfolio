<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicStore</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header">
    <h1>My Music XD 🎧</h1>

    <div>
        <button class="btn-playlist" onclick="openPlaylist()">Playlist</button>
    </div>
</header>

<!-- ================= PRODUCT LIST ================= -->
<main class="main-content">
    <div class="product-content">

        <!-- CARD 1 -->
        <div class="product-card"
            data-album="Lovers Rock"
            data-artist="TV Girl"
            data-song="song1"
                        data-video="/assets/Project-1/asset/animasi.mp4">

            
            <img src="/assets/Project-1/asset/tvgirl.jpeg">
            <div class="product-details">
                <h3>Lovers Rock</h3>
                <p>TV Girl</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('Lovers Rock - TV Girl')">Add to Playlist</button>

                <audio id="song1" src="/assets/Project-1/asset/Lovers Rock.mp3"></audio>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="product-card"
            data-album="Anything You Want"
            data-artist="Reality Club"
            data-song="song2"
            data-video="/assets/Project-1/asset/RealityClub.mp4">


            <img src="/assets/Project-1/asset/RealityClub.png">
            <div class="product-details">
                <h3>Anything You Want</h3>
                <p>Reality Club</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('Anything You Want - Reality Club')">Add to Playlist</button>

                <audio id="song2" src="/assets/Project-1/asset/RealityClub.mp4"></audio>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="product-card"
            data-album="Please, Please, Please Let Me Get What I Want"
            data-artist="The Smith"
            data-song="song3"
            data-video="/assets/Project-1/asset/TheSmiths.mp4">

            <img src="/assets/Project-1/asset/TheSmith.png">
            <div class="product-details">
                <h3>Please, Please, Please Let Me Get What I Want</h3>
                <p>The Smith</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('Please, Please, Please Let Me Get What I Want - The Smith')">Add to Playlist</button>

                <audio id="song3" src="/assets/Project-1/asset/TheSmiths.m4a"></audio>
            </div>
        </div>

    </div>
</main>

<!-- ================= POPUP VIDEO + AUDIO ================= -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePopup()">&times;</span>

        <!-- FIX: Video selalu animasi.mp4 -->
        <video id="modalVideo" controls style="width:100%; max-height:350px; border-radius:10px;">
            <source id="modalVideoSrc" src="/assets/Project-1/asset/RealityClub.mp4" type="video/mp4">
        </video>

        <h3 id="modalAlbum"></h3>
        <p id="modalArtist"></p>

        <audio controls id="modalAudio"></audio>
    </div>
</div>

<!-- ================= PLAYLIST POPUP ================= -->
<div class="modal" id="playlistModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePlaylist()">&times;</span>
        <h3>My Playlist</h3>
        <ul id="playlist"></ul>
    </div>
</div>

<!-- ================= SCRIPT ================= -->


</body>

<script src="script.js"></script>
</body>
</html>
