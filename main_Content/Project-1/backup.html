<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicStore</title>

<style>
/* ---------------- ROOT COLORS ---------------- */
:root {
    --bg: #EFEEEA;
    --card: #ffffff;
    --text: #333;
    --accent-primary:#32cc8c;
    --accent-secondary: #146542;
    --accent-button: #32cc8c;
}

body.dark {
    --bg: #1a202c;
    --card: #2d3748;
    --text: #e2e8f0;
    --accent-primary: #000;
    --accent-secondary: #fbc02d;
}

/* ---------------- GLOBAL ---------------- */
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    transition: 0.3s;
}

/* ---------------- HEADER ---------------- */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: var(--accent-primary);
    color: white;
}

.toggle-dark, .btn-playlist {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* ---------------- PRODUCT GRID ---------------- */
.main-content {
    padding: 25px;
}

.product-content {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.product-card {
    background: var(--card);
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    transition: 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    cursor: pointer;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 12px;
}

.product-details h3 {
    color: var(--accent-primary);
}

.btn-play {
    background: var(--accent-button);
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

.btn-play:hover {
    background: #004d40;
}

/* ---------------- MODAL ---------------- */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: var(--card);
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    position: relative;
}

.modal-close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 30px;
    cursor: pointer;
}

/* Playlist */
#playlistModal ul {
    max-height: 250px;
    overflow-y: auto;
    list-style: none;
    padding: 0;
}
#playlistModal li {
    padding: 10px;
    background: var(--bg);
    margin-bottom: 8px;
    border-radius: 7px;
}
</style>

</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header">
    <h1>My Music XD 🎧</h1>

    <div>
        <button class="toggle-dark" onclick="toggleDarkMode()">Dark Mode</button>
        <button class="btn-playlist" onclick="openPlaylist()">Playlist</button>
    </div>
</header>

<!-- ================= PRODUCT LIST ================= -->
<main class="main-content">
    <div class="product-content">

        <!-- CARD 1 -->
        <div class="product-card"
            data-album="Lovers Rock"
            data-artist="TV Girl"
            data-song="song1">
            
            <img src="tvgirl.jpeg">
            <div class="product-details">
                <h3>Lovers Rock</h3>
                <p>TV Girl</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('Lovers Rock - TV Girl')">Add to Playlist</button>

                <audio id="song1" src="Lovers Rock.mp3"></audio>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="product-card"
            data-album="I Can't Handle Change"
            data-artist="Roar"
            data-song="song2">

            <img src="roar.jpeg">
            <div class="product-details">
                <h3>I Can't Handle Change</h3>
                <p>Roar</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('I Can’t Handle Change - Roar')">Add to Playlist</button>

                <audio id="song2" src="Roar - I Can’t Handle Change.mp3"></audio>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="product-card"
            data-album="Chamber Of Reflection"
            data-artist="Mac DeMarco"
            data-song="song3">

            <img src="mac.jpeg">
            <div class="product-details">
                <h3>Chamber Of Reflection</h3>
                <p>Mac DeMarco</p>

                <button class="btn-play" onclick="openPopup(this)">Play</button><br>
                <button onclick="addToPlaylist('Chamber Of Reflection - Mac DeMarco')">Add to Playlist</button>

                <audio id="song3" src="Chamber Of Reflection.mp3"></audio>
            </div>
        </div>

    </div>
</main>

<!-- ================= POPUP VIDEO + AUDIO ================= -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePopup()">&times;</span>

        <!-- FIX: Video selalu animasi.mp4 -->
        <video id="modalVideo" controls style="width:100%; max-height:350px; border-radius:10px;">
            <source id="modalVideoSrc" src="animasi.mp4" type="video/mp4">
        </video>

        <h3 id="modalAlbum"></h3>
        <p id="modalArtist"></p>

        <audio controls id="modalAudio"></audio>
    </div>
</div>

<!-- ================= PLAYLIST POPUP ================= -->
<div class="modal" id="playlistModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePlaylist()">&times;</span>
        <h3>My Playlist</h3>
        <ul id="playlist"></ul>
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
// DARK MODE
function toggleDarkMode() {
    document.body.classList.toggle("dark");
}

// PLAYLIST
const playlist = [];
function addToPlaylist(name) {
    playlist.push(name);
    const li = document.createElement("li");
    li.textContent = name;
    document.getElementById("playlist").appendChild(li);
}

// PLAYLIST POPUP
function openPlaylist() {
    document.getElementById("playlistModal").style.display = "flex";
}
function closePlaylist() {
    document.getElementById("playlistModal").style.display = "none";
}

// OPEN POPUP (VIDEO + AUDIO)
function openPopup(btn) {
    const card = btn.closest('.product-card');

    const modal = document.getElementById("modal");
    const modalVideo = document.getElementById("modalVideo");
    const modalVideoSrc = document.getElementById("modalVideoSrc");
    const modalAudio = document.getElementById("modalAudio");

    // Album & Artist
    document.getElementById("modalAlbum").textContent = card.dataset.album;
    document.getElementById("modalArtist").textContent = card.dataset.artist;

    // Video selalu animasi.mp4
    modalVideoSrc.src = "animasi.mp4";
    modalVideo.load();
    modalVideo.currentTime = 0;

    // Audio sesuai card
    modalAudio.src = document.getElementById(card.dataset.song).src;

    // Sinkron audio → video
    modalAudio.onplay = () => modalVideo.play();
    modalAudio.onpause = () => modalVideo.pause();
    modalAudio.onseeked = () => modalVideo.currentTime = modalAudio.currentTime;
    modalAudio.onratechange = () => modalVideo.playbackRate = modalAudio.playbackRate;

    // Sinkron video → audio (PERMINTAANMU)
    modalVideo.onpause = () => modalAudio.pause();
    modalVideo.onplay  = () => modalAudio.play();

    modal.style.display = "flex";
    modalAudio.play();
}


// CLOSE POPUP
function closePopup() {
    const modal = document.getElementById("modal");
    const modalAudio = document.getElementById("modalAudio");
    const modalVideo = document.getElementById("modalVideo");

    modalAudio.pause();
    modalVideo.pause();

    modal.style.display = "none";
}
</script>

</body>
</html>
